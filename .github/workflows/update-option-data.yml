name: Update JPX Option Data

on:

  # 手動実行
  workflow_dispatch:

  # ======================================================
  # 5分間隔で実行
  #
  # 毎時00分を避けることで、GitHub Actionsの混雑による
  # スケジュール遅延をできるだけ避ける
  #
  # 02, 07, 12, 17, ... , 57分
  # 月～金
  # ======================================================
  schedule:
    - cron: "2-57/5 * * * 1-5"


permissions:
  contents: write


jobs:

  update-option-data:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install requests beautifulsoup4


      # ======================================================
      # Get JPX option data
      # ======================================================

      - name: Get JPX option data
        run: |

          echo "========================================"
          echo "GET JPX OPTION DATA"
          echo "========================================"

          echo "UTC:"
          date -u

          echo "JST:"
          TZ=Asia/Tokyo date

          echo ""

          python get_option_data.py


      # ======================================================
      # Calculate differences + Discord
      # ======================================================

      - name: Calculate differences and send Discord
        env:

          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |

          echo "========================================"
          echo "CALCULATE DIFFERENCES"
          echo "========================================"

          echo "UTC:"
          date -u

          echo "JST:"
          TZ=Asia/Tokyo date

          echo ""

          python calculate_difference.py


      # ======================================================
      # Check files
      # ======================================================

      - name: Check data files
        run: |

          echo "========================================"
          echo "DATA FILES"
          echo "========================================"

          find data -maxdepth 2 -type f -print | sort

          echo ""

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # ======================================================
      # Commit and push
      # ======================================================

      - name: Commit and push
        run: |

          echo "========================================"
          echo "COMMIT AND PUSH"
          echo "========================================"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo ""
            echo "No changes to commit."
            echo ""

          else

            echo ""
            echo "Changes detected."
            echo ""

            git status --short

            echo ""

            git commit \
              -m "Update JPX option data"

            echo ""
            echo "Pushing to main..."
            echo ""

            git push origin HEAD:main

            echo ""
            echo "Push completed."
            echo ""

          fi


      # ======================================================
      # Finish
      # ======================================================

      - name: Finished
        run: |

          echo ""
          echo "========================================"
          echo "JPX OPTION DATA UPDATE FINISHED"
          echo "========================================"

          echo "UTC:"
          date -u

          echo ""

          echo "JST:"
          TZ=Asia/Tokyo date

          echo ""

          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""

          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo "========================================"
