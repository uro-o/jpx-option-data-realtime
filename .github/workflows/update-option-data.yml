name: Debug JPX Option Data

on:

  # 手動実行
  workflow_dispatch:

  # 月～金、24時間、1分ごと
  schedule:
    - cron: "* * * * 1-5"


jobs:

  debug-qri:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # GitHubリポジトリ取得
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Pythonセットアップ
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # Pythonライブラリ
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # ==========================================
      # QRIアクセスデバッグ
      # ==========================================

      - name: Run QRI debug
        run: |
          python get_option_data.py
