name: Update JPX Option Data Realtime

on:

  # GitHub上から手動実行できるようにする
  workflow_dispatch:

  # 1分ごとにチェック
  schedule:
    - cron: "* * 0-6 * * 1-5"


jobs:

  update-option-data:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================
      # Install
      # ==========================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4


      # ==========================================
      # QRI取得
      # ==========================================

      - name: Get QRI option data
        run: |

          python get_option_data.py


      # ==========================================
      # CSV確認
      # ==========================================

      - name: Check data
        run: |

          echo "========================================"
          echo "Data files"
          echo "========================================"

          find data -type f -maxdepth 2 -print

          echo ""

          echo "========================================"
          echo "Latest CSV"
          echo "========================================"

          if [ -f data/latest.csv ]; then
            wc -l data/latest.csv
            head -5 data/latest.csv
          fi


      # ==========================================
      # Git設定
      # ==========================================

      - name: Configure Git
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================
      # Commit
      # ==========================================

      - name: Commit updated data
        run: |

          git add data/

          if git diff --cached --quiet; then

            echo "No data changes."

          else

            git commit \
              -m "Update JPX option data"

          fi


      # ==========================================
      # Push
      # ==========================================

      - name: Push changes
        run: |

          git push
