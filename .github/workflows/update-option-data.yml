name: JPX Option Data Realtime

on:

  # 手動実行
  workflow_dispatch:

  # 月～金、24時間、1分ごと
  schedule:
    - cron: "* * * * 1-5"


jobs:

  update-option-data:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # GitHub Repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # Install libraries
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # =====================================================
      # Get QRI option data
      # =====================================================

      - name: Get option data
        run: |
          echo "========================================"
          echo "GET JPX OPTION DATA"
          echo "========================================"

          python get_option_data.py


      # =====================================================
      # Check data files
      # =====================================================

      - name: Check data files
        run: |
          echo "========================================"
          echo "DATA FILES"
          echo "========================================"

          find data -maxdepth 3 -type f -print || true


      # =====================================================
      # Calculate differences
      # =====================================================

      - name: Calculate differences
        run: |
          echo "========================================"
          echo "CALCULATING DIFFERENCE"
          echo "========================================"

          python calculate_difference.py


      # =====================================================
      # Check differences.csv
      # =====================================================

      - name: Check differences
        run: |
          echo "========================================"
          echo "DIFFERENCES"
          echo "========================================"

          if [ -f data/differences.csv ]; then
            echo "differences.csv found"
            echo "----------------------------------------"
            head -50 data/differences.csv
          else
            echo "differences.csv not found"
          fi


      # =====================================================
      # Discord notification
      # =====================================================

      - name: Send Discord notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "========================================"
          echo "DISCORD NOTIFICATION"
          echo "========================================"

          python notify_discord.py


      # =====================================================
      # Git status
      # =====================================================

      - name: Check Git status
        run: |
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # =====================================================
      # Commit data
      # =====================================================

      - name: Commit data
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update JPX option data"

          fi


      # =====================================================
      # Push to GitHub
      # =====================================================

      - name: Push data
        run: |

          git pull --rebase origin main

          git push origin main
