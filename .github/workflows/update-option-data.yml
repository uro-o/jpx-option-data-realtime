name: Update JPX Option Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

concurrency:
  group: jpx-option-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-option-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Get JPX option data
        run: |
          echo "========================================"
          echo "GET JPX OPTION DATA"
          echo "========================================"
          python get_option_data.py

      - name: Fix contract labels from QRI
        run: |
          echo "========================================"
          echo "FIX CONTRACT LABELS"
          echo "========================================"
          python fix_contract_labels.py

      - name: Sort data by trade time
        run: |
          echo "========================================"
          echo "SORT BY TRADE TIME"
          echo "========================================"
          python sort_latest_by_trade_time.py

      - name: Calculate differences and send Discord
        env:
          DISCORD_WEBHOOK_BIG: ${{ secrets.DISCORD_WEBHOOK_BIG }}
          DISCORD_WEBHOOK_MEDIUM: ${{ secrets.DISCORD_WEBHOOK_MEDIUM }}
          DISCORD_WEBHOOK_OI: ${{ secrets.DISCORD_WEBHOOK_OI }}
          DISCORD_WEBHOOK_OTHER: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
        run: |
          echo "========================================"
          echo "CALCULATE DIFFERENCES"
          echo "========================================"
          python calculate_difference.py

      - name: Check data files
        run: |
          echo "========================================"
          echo "DATA FILES"
          echo "========================================"
          find data -maxdepth 2 -type f -print | sort
          echo ""
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"
          git status --short

      - name: Commit and push
        run: |
          echo "========================================"
          echo "COMMIT AND PUSH"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            echo "Changes detected."
            git status --short

            git commit -m "Update JPX option data"

            echo "Fetching latest main..."
            git fetch origin main

            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Remote is already up to date."
            else
              echo "Remote has newer commits."
              echo "Resetting to remote main..."
              git reset --soft origin/main
              git add data/

              if git diff --cached --quiet; then
                echo "No local data changes after sync."
              else
                git commit -m "Update JPX option data"
              fi
            fi

            echo "Pushing to main..."
            git push origin HEAD:main
            echo "Push completed."
          fi

      - name: Finished
        run: |
          echo ""
          echo "========================================"
          echo "JPX OPTION DATA UPDATE FINISHED"
          echo "========================================"
          echo "Time:"
          date
          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"
          echo ""
          echo "Branch:"
          echo "${GITHUB_REF_NAME}"
          echo "========================================"
