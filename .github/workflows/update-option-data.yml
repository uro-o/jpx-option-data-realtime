name: Update JPX Option Data


# ============================================================
# Trigger
# ============================================================

on:

  # 手動実行
  workflow_dispatch:

  # 月～金、24時間、1分ごと
  schedule:
    - cron: "* * * * 1-5"


# ============================================================
# GitHub Actions permissions
# ============================================================

permissions:
  contents: write


# ============================================================
# Job
# ============================================================

jobs:

  update-option-data:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # Setup Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ======================================================
      # Install Python packages
      # ======================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install requests beautifulsoup4


      # ======================================================
      # Get JPX option data
      # ======================================================

      - name: Get JPX option data
        run: |

          echo "========================================"
          echo "GET JPX OPTION DATA"
          echo "========================================"

          python get_option_data.py


      # ======================================================
      # Calculate differences
      # ======================================================

      - name: Calculate differences
        run: |

          echo "========================================"
          echo "CALCULATE DIFFERENCES"
          echo "========================================"

          python calculate_difference.py


      # ======================================================
      # Check generated files
      # ======================================================

      - name: Check data files
        run: |

          echo "========================================"
          echo "DATA FILES"
          echo "========================================"

          echo ""

          if [ -d "data" ]; then

            find data -maxdepth 2 -type f -print | sort

          else

            echo "data directory does not exist"

          fi

          echo ""

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # ======================================================
      # Commit and push
      # ======================================================

      - name: Commit and push
        run: |

          echo "========================================"
          echo "COMMIT AND PUSH"
          echo "========================================"

          # Git user
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # Add generated data
          git add data/


          # Check whether there are changes
          if git diff --cached --quiet; then

            echo ""
            echo "No changes to commit."
            echo ""

          else

            echo ""
            echo "Changes detected."
            echo ""

            git status --short

            echo ""

            # Commit
            git commit -m "Update JPX option data"


            # Push
            echo ""
            echo "Pushing to main..."
            echo ""

            git push origin HEAD:main

            echo ""
            echo "Push completed."
            echo ""

          fi


      # ======================================================
      # Finish
      # ======================================================

      - name: Finished
        run: |

          echo ""
          echo "========================================"
          echo "JPX OPTION DATA UPDATE FINISHED"
          echo "========================================"

          echo "Time:"
          date

          echo ""

          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""

          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo "========================================"
